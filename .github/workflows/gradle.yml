name: Java CI with Gradle

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Start MySQL Container
        run: docker compose up -d --wait --wait-timeout 60

      - name: Check container status and logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs mysqldb

      - name: Start SUT
        run: |
          java -jar ./artifacts/app-deadline.jar \
            -P:jdbc.url=jdbc:mysql://localhost:3306/app \
            -P:jdbc.user=app \
            -P:jdbc.password=pass &

      - name: Wait for SUT
        run: sleep 30

      - name: Run tests
        run: ./gradlew test -Dselenide.headless=true --info