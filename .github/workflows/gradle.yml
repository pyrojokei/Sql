name: Java CI with Gradle

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Container start
        uses: hoverkraft-tech/compose-action@v2.0.1

      - name: Waiting for container start
        run: sleep 30

      - name: Start SUT
        run: java -jar ./artifacts/app-deadline.jar -P:jdbc.url=jdbc:mysql://localhost:3306/app -P:jdbc.user=app -P:jdbc.password=pass &

      - name: Wait for SUT
        run: sleep 10

      - name: Run tests
        run: ./gradlew test -Dselenide.headless=true -Dchromeoptions.prefs="profile.password_manager_leak_detection=false" --info
